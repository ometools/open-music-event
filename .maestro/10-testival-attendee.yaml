appId: ${APP_ID}
---
# Fastlane has already installed the UI-marked app and cleared its data. The
# app prepares Testival through the real source validator before Browse appears.
- launchApp
- extendedWaitUntil:
    visible:
      id: button.browse-event.testival-source-testival-2026
    timeout: 30000
- assertVisible:
    id: app.root
- takeScreenshot: 10-browse

# The attendee learns enough about Testival to decide to install it.
- tapOn:
    id: button.browse-event.testival-source-testival-2026
- extendedWaitUntil:
    visible:
      id: view.event-browse-detail.testival-source-testival-2026
    timeout: 15000
- assertVisible: Testival 2026
- waitForAnimationToEnd
- takeScreenshot: 20-testival-detail

# Entering the event opens Saturday on the first music stage.
- tapOn:
    id: button.enter-event.testival-source-testival-2026
- extendedWaitUntil:
    visible:
      id: button.performance.opening-set
    timeout: 30000
- assertVisible:
    id: view.schedule.testival-source-testival-2026
- waitForAnimationToEnd
- takeScreenshot: 30-testival-schedule

# Multiple stages are live: Canopy has a different Saturday program, and the
# attendee can return to Meadow without relying on the stage's visible name.
- tapOn:
    id: button.schedule-stage.canopy
- extendedWaitUntil:
    visible:
      id: button.performance.sunset-session
    timeout: 15000
- tapOn:
    id: button.schedule-stage.meadow
- extendedWaitUntil:
    visible:
      id: button.performance.opening-set
    timeout: 15000

# Collaborative Set proves that a real performance detail can render multiple
# credited contributors and their billing from the imported source.
- scrollUntilVisible:
    element:
      id: button.performance.collaborative-set
    direction: DOWN
    timeout: 20000
- tapOn:
    id: button.performance.collaborative-set
- extendedWaitUntil:
    visible:
      id: view.performance-detail.collaborative-set
    timeout: 15000
- assertVisible: ".*Artist One.*"
- assertVisible: ".*Artist Two.*"
- assertVisible: ".*Meadow.*"
- waitForAnimationToEnd
- takeScreenshot: 40-collaborative-set-detail
- runFlow: helpers/back.yaml

# Sunday contains a different cross-stage program. List mode deliberately
# exercises the second schedule renderer instead of only the timeline cards.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: Saturday
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Saturday
- tapOn: Sunday
- extendedWaitUntil:
    visible:
      id: button.performance.morning-set
    timeout: 15000
- tapOn:
    id: menu.schedule-kind
- tapOn: List
- extendedWaitUntil:
    visible:
      id: button.performance.closing-set
    timeout: 15000
- assertVisible:
    id: button.performance.morning-set
- waitForAnimationToEnd
- takeScreenshot: 50-sunday-schedule

# Workshop stages are a separate attendee schedule, as they are in the richer
# organizer sources Testival represents.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: Sunday
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Sunday
- tapOn: Saturday
- tapOn: Workshops
- extendedWaitUntil:
    visible:
      id: button.performance.movement-workshop
    timeout: 15000
- assertVisible: Movement Workshop

# Contributor navigation proves that one artist can appear across stages and
# days, not merely as text embedded in a performance card.
- tapOn: Contributors
- extendedWaitUntil:
    visible:
      id: view.contributors.testival-source-testival-2026
    timeout: 15000
- tapOn:
    id: button.contributor.artist-two
- extendedWaitUntil:
    visible:
      id: view.contributor-detail.artist-two
    timeout: 15000
- assertVisible: Artist Two
- waitForAnimationToEnd
- takeScreenshot: 60-artist-two-detail
- scrollUntilVisible:
    element:
      id: button.performance.collaborative-set
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: button.performance.morning-set
    direction: DOWN
    timeout: 20000
- runFlow: helpers/back.yaml

# Overflow features remain reachable through More on compact iOS and Android.
# Canopy's detail proves the stage lineup and stage-owned schedule are live.
- tapOn: More
- tapOn:
    id: tab-feature.stages
- extendedWaitUntil:
    visible:
      id: view.stages.testival-source-testival-2026
    timeout: 15000
- tapOn:
    id: button.stage.canopy
- extendedWaitUntil:
    visible:
      id: view.stage-detail.canopy
    timeout: 15000
- assertVisible: Canopy
- waitForAnimationToEnd
- takeScreenshot: 70-canopy-detail
- scrollUntilVisible:
    element:
      text: Artist Three
    direction: DOWN
    timeout: 20000
- assertVisible: Artist Two
- runFlow: helpers/back.yaml
- runFlow: helpers/back.yaml

# The map is entirely local and deterministic. Switching styles proves the
# source-defined map catalog rather than merely opening a placeholder screen.
- tapOn:
    id: tab-feature.siteMap
- extendedWaitUntil:
    visible:
      id: view.site-map.testival-source-testival-2026
    timeout: 15000
- tapOn:
    id: site-map-style-switcher
- tapOn: Safety
# SwiftUI propagates the screen's accessibility identifier onto descendants,
# so iOS observes the decoded-image marker by its accessibility label. Compose
# preserves the marker's identifier on Android. Both signals are emitted only
# after the selected image has decoded successfully.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: Loaded Site Map
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: image.site-map.safety
          timeout: 15000
- assertNotVisible: This site map could not be loaded.
- takeScreenshot: 80-safety-map
- runFlow: helpers/back.yaml

# Communications finish the functional story without adding another visual
# baseline: General has a pinned source post, while Safety requires alerts.
- tapOn:
    id: tab-feature.communications
- extendedWaitUntil:
    visible:
      id: view.communications.testival-source-testival-2026
    timeout: 15000
- tapOn:
    id: button.channel.general
- extendedWaitUntil:
    visible:
      id: view.channel-detail.general
    timeout: 15000
- assertVisible: Welcome to Testival
- tapOn:
    id: button.communication-post.welcome
- extendedWaitUntil:
    visible:
      id: view.communication-post.welcome
    timeout: 15000
- assertVisible: ".*Check the schedule.*"
- runFlow: helpers/back.yaml
- runFlow: helpers/back.yaml
- tapOn:
    id: button.channel.safety
- extendedWaitUntil:
    visible:
      id: view.channel-detail.safety
    timeout: 15000
- assertVisible: ".*Notifications are required.*"
