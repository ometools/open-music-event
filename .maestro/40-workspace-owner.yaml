appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: button.browse-event.3mrdbziccpcah
    timeout: 30000
- tapOn:
    id: button.browse-event.3mrdbziccpcah
- tapOn:
    id: button.enter-event.3mrdbziccpcah
- extendedWaitUntil:
    visible:
      id: view.schedule.at://did:web:example.com/events.openmusic.event/3mrdbziccpcah
    timeout: 30000
- tapOn: More
- tapOn:
    id: tab-feature.settings
- tapOn: Enter Workspace
- tapOn: More
- extendedWaitUntil:
    visible: Leave Workspace
    timeout: 15000
- assertNotVisible: Edit Event
- runFlow: helpers/back.yaml
- extendedWaitUntil:
    visible:
      id: tab-feature.workspace
    timeout: 15000
- tapOn:
    id: tab-feature.workspace
- assertVisible: No local changes.
- takeScreenshot: 91-workspace-empty
- extendedWaitUntil:
    visible:
      id: workspace.record.event-info
    timeout: 15000
- tapOn:
    id: workspace.record.event-info
- extendedWaitUntil:
    visible: Edit Event Info
    timeout: 15000
- tapOn:
    id: field.event-info.name
- eraseText
- inputText: Testival Workspace Edit
- tapOn: Save
- extendedWaitUntil:
    visible: Edited event
    timeout: 15000
- runFlow: helpers/back.yaml
- tapOn:
    id: tab-feature.about
- extendedWaitUntil:
    visible: Testival Workspace Edit
    timeout: 15000
- assertVisible:
    id: button.event-info.edit
- takeScreenshot: 92-workspace-edited-event
- runFlow: helpers/back.yaml
- tapOn:
    id: tab-feature.workspace
- extendedWaitUntil:
    visible: Edited event
    timeout: 15000
- tapOn:
    id: workspace.changes.reset
- assertVisible: Reset workspace changes?
- tapOn: Reset
- extendedWaitUntil:
    visible: No local changes.
    timeout: 15000
- extendedWaitUntil:
    notVisible: Resetting changes
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 93-workspace-reset
- runFlow: helpers/back.yaml
- tapOn:
    id: tab-feature.about
- extendedWaitUntil:
    visible: Testival 2026
    timeout: 15000
- assertNotVisible: Testival Workspace Edit
