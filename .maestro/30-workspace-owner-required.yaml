appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: button.browse-event.3mrdbziccpcah
    timeout: 30000
- tapOn: My Events
- assertNotVisible: {id: events.create}
- tapOn: Browse
- tapOn:
    id: button.browse-event.3mrdbziccpcah
- tapOn:
    id: button.enter-event.3mrdbziccpcah
- extendedWaitUntil:
    visible:
      id: view.schedule.at://did:web:example.com/events.openmusic.event/3mrdbziccpcah
    timeout: 30000
- tapOn: More
- tapOn:
    id: tab-feature.settings
- assertNotVisible: Enter Workspace
- assertNotVisible: Edit Event
- takeScreenshot: 90-workspace-signed-out
- assertNotVisible:
    id: tab-feature.workspace
