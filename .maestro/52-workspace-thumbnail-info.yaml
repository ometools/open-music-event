appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: button.browse-event.3mrdbziccpcah
    timeout: 30000
- tapOn:
    id: button.browse-event.3mrdbziccpcah
- tapOn:
    id: button.enter-event.3mrdbziccpcah
- extendedWaitUntil:
    visible:
      id: view.schedule.at://did:web:example.com/events.openmusic.event/3mrdbziccpcah
    timeout: 30000
- tapOn: More
- tapOn:
    id: tab-feature.settings
- tapOn: Enter Workspace
- tapOn: More
- extendedWaitUntil:
    visible: Leave Workspace
    timeout: 15000
- runFlow: helpers/back.yaml
- tapOn:
    id: tab-feature.about
- tapOn:
    id: button.event-info.edit
- assertVisible: Edit Event Info
- scrollUntilVisible:
    element:
      text: Add Media
    direction: DOWN
    timeout: 20000
- tapOn: Add Media
- tapOn: External Link
- tapOn:
    id: field.event-media.url
- inputText: https://example.com/event-stream
- tapOn: return
- scrollUntilVisible:
    element:
      text: Thumbnail URL
    direction: DOWN
    timeout: 20000
- tapOn: Thumbnail URL
- inputText: https://example.com/event-stream-poster.jpg
- tapOn: return
- scrollUntilVisible:
    element:
      text: Thumbnail Info
    direction: DOWN
    timeout: 20000
- tapOn: Thumbnail Info
- assertVisible: Image Info
- tapOn: Title
- inputText: Event Stream Poster
- tapOn: return
- tapOn: Save
- assertVisible: Thumbnail Info
- scrollUntilVisible:
    element:
      id: button.event-media.done
    direction: DOWN
    timeout: 20000
- tapOn:
    id: button.event-media.done
- assertVisible: External media
- tapOn: Save
- tapOn:
    id: button.event-info.edit
- scrollUntilVisible:
    element:
      text: External media
    direction: DOWN
    timeout: 20000
- tapOn: Media Actions
- tapOn: Edit
- scrollUntilVisible:
    element:
      text: Thumbnail Info
    direction: DOWN
    timeout: 20000
- tapOn: Thumbnail Info
- assertVisible: Event Stream Poster
