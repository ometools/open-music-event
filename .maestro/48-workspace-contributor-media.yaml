appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: button.browse-event.3mrdbziccpcah
    timeout: 30000
- tapOn:
    id: button.browse-event.3mrdbziccpcah
- tapOn:
    id: button.enter-event.3mrdbziccpcah
- extendedWaitUntil:
    visible:
      id: view.schedule.at://did:web:example.com/events.openmusic.event/3mrdbziccpcah
    timeout: 30000
- tapOn: More
- tapOn:
    id: tab-feature.settings
- tapOn: Enter Workspace
- tapOn: More
- extendedWaitUntil:
    visible: Leave Workspace
    timeout: 15000
- runFlow: helpers/back.yaml
- tapOn: More
- tapOn:
    id: tab-feature.contributors
- tapOn:
    id: button.contributor.at://did:web:example.com/events.openmusic.contributor/3mrdbziccpcaq
- extendedWaitUntil:
    visible:
      id: view.contributor-detail.at://did:web:example.com/events.openmusic.contributor/3mrdbziccpcaq
    timeout: 15000
- tapOn: Edit
- assertVisible: Edit Contributor
- scrollUntilVisible:
    element:
      text: Add Media
    direction: DOWN
    timeout: 20000
- tapOn: Add Media
- tapOn: External Link
- tapOn:
    id: field.contributor-media.url
- inputText: https://example.com/artist-video
- tapOn: return
- tapOn:
    id: field.contributor-media.title
- inputText: Artist Video
- tapOn: return
- scrollUntilVisible:
    element:
      id: button.contributor-media.done
    direction: DOWN
    timeout: 20000
- tapOn:
    id: button.contributor-media.done
- assertVisible: Artist Video
- tapOn: Save
- extendedWaitUntil:
    visible:
      id: view.contributor-detail.at://did:web:example.com/events.openmusic.contributor/3mrdbziccpcaq
    timeout: 15000
- tapOn: Edit
- scrollUntilVisible:
    element:
      text: Artist Video
    direction: DOWN
    timeout: 20000
- assertVisible: Artist Video
- waitForAnimationToEnd
- takeScreenshot: 95-workspace-contributor-media
