appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: button.browse-event.3mrdbziccpcah
    timeout: 30000
- tapOn:
    id: button.browse-event.3mrdbziccpcah
- tapOn:
    id: button.enter-event.3mrdbziccpcah
- extendedWaitUntil:
    visible:
      id: view.schedule.at://did:web:example.com/events.openmusic.event/3mrdbziccpcah
    timeout: 30000
- tapOn: More
- tapOn:
    id: tab-feature.settings
- tapOn: Enter Workspace
- tapOn: More
- assertVisible: Leave Workspace
- runFlow: helpers/back.yaml
- tapOn: More
- tapOn:
    id: tab-feature.location
- assertVisible: 1 Fixture Road, Denver, CO 80202
- tapOn: Edit
- assertVisible: Edit Location
- tapOn: Location Actions
- assertVisible: Edit
- assertVisible: Delete
- tapOn: Edit
- tapOn: Add Location
- tapOn: Name
- inputText: Testival North Gate
- tapOn: Save
- extendedWaitUntil:
    visible: Testival North Gate
    timeout: 15000
- tapOn: More
- tapOn:
    id: tab-feature.siteMap
- assertVisible: Testival Grounds
- tapOn: Edit Site Map
- assertVisible: Edit Site Map
- tapOn: Add Style
- scrollUntilVisible:
    element:
      id: field.site-map.style-title
    direction: DOWN
- tapOn:
    id: field.site-map.style-title
- inputText: Night
- tapOn: return
- scrollUntilVisible:
    element:
      id: field.site-map.image-url
    direction: DOWN
- tapOn:
    id: field.site-map.image-url
- inputText: https://example.com/night-map.png
- tapOn: return
- tapOn: Default Style, Public
- tapOn: Safety
- tapOn: Save
- extendedWaitUntil:
    visible: Testival Grounds
    timeout: 15000
- tapOn: Edit Site Map
- assertVisible: Night
- assertVisible: Default Style, Safety
