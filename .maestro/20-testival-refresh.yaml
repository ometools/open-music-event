appId: ${APP_ID}
---
# This is a separate, clean install from the visual attendee story. Revision A
# enters through the real validator before the attendee creates local state.
- launchApp
- extendedWaitUntil:
    visible:
      id: button.browse-event.testival-source-testival-2026
    timeout: 30000
- tapOn:
    id: button.browse-event.testival-source-testival-2026
- extendedWaitUntil:
    visible:
      id: button.enter-event.testival-source-testival-2026
    timeout: 15000
- tapOn:
    id: button.enter-event.testival-source-testival-2026
- extendedWaitUntil:
    visible:
      id: button.performance.opening-set
    timeout: 30000

# Opening Welcome records attendee-owned read state without introducing another
# server dependency into this refresh-focused flow.
- tapOn:
    id: tab-feature.more
- tapOn:
    id: tab-feature.communications
- extendedWaitUntil:
    visible:
      id: button.channel.general
    timeout: 15000
- tapOn:
    id: button.channel.general
- extendedWaitUntil:
    visible:
      id: button.communication-post.welcome
    timeout: 15000
- tapOn:
    id: button.communication-post.welcome
- extendedWaitUntil:
    visible:
      id: view.communication-post.welcome
    timeout: 15000
- runFlow: helpers/back.yaml

# Canopy proves revision A is still mounted before resume. The fixture's new
# Surprise Set does not exist until the production refresh transaction commits.
- tapOn:
    id: tab-feature.schedule
- extendedWaitUntil:
    visible:
      id: button.schedule-stage.canopy
    timeout: 15000
- tapOn:
    id: button.schedule-stage.canopy
- extendedWaitUntil:
    visible:
      id: button.performance.sunset-session
    timeout: 15000
- assertNotVisible:
    id: button.performance.surprise-set

# Home then foreground is the real application-delegate resume signal. AppView
# supplies revision B and its exact immutable archive through the HTTP boundary.
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: button.performance.surprise-set
    timeout: 30000
- assertVisible: Surprise Set
- tapOn:
    id: button.schedule-stage.meadow
- scrollUntilVisible:
    element:
      id: button.performance.collaborative-set
    direction: DOWN
    timeout: 20000
- assertVisible: Collaborative Set — Updated

# Revision B adds a post while the attendee's earlier source post remains.
# The Swift story checks its read state and the other local preference tables.
- tapOn:
    id: tab-feature.more
- tapOn:
    id: tab-feature.communications
- extendedWaitUntil:
    visible:
      id: button.channel.general
    timeout: 15000
- tapOn:
    id: button.channel.general
- extendedWaitUntil:
    visible:
      id: button.communication-post.schedule-update
    timeout: 15000
- assertVisible: Saturday Schedule Updated
- assertVisible:
    id: button.communication-post.welcome
