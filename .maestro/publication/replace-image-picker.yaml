appId: ${APP_ID}
---
# Resume after editing the description in the Event form.
- scrollUntilVisible:
    element: Image Actions
    direction: UP
- tapOn: Image Actions
- tapOn: Delete
- tapOn: Edit Event Info
- scrollUntilVisible:
    element: Add Media
    direction: DOWN
    centerElement: true
- tapOn: Add Media
- tapOn: Image
- tapOn: Choose Photos
