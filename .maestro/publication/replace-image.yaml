appId: ${APP_ID}
---
- runFlow: ../helpers/back.yaml
- tapOn: {id: workspace.record.event-info}
- assertVisible: Edit Event Info
- tapOn: 'Testival published from the app with image A'
- tapOn: {point: '87%,43%'}
- eraseText: 200
- inputText: ${DESCRIPTION}
- tapOn: Edit Event Info
- scrollUntilVisible:
    element: Image Actions
    direction: DOWN
- tapOn: Image Actions
- tapOn: Delete
- tapOn: Edit Event Info
- scrollUntilVisible:
    element: Add Media
    direction: DOWN
    centerElement: true
- tapOn: Add Media
- tapOn: Image
- tapOn: Choose Photos
- takeScreenshot: replacement-media-actions
