appId: ${APP_ID}
---
- tapOn: Testival 2026
- tapOn: More
- tapOn: {id: tab-feature.settings}
- tapOn: Enter Workspace
- tapOn: More
- extendedWaitUntil:
    visible: Leave Workspace
    timeout: 15000
- runFlow: ../helpers/back.yaml
- tapOn: {id: tab-feature.workspace}
- tapOn: {id: workspace.record.event-info}
- assertVisible: Edit Event Info
- tapOn:
    text: 'A compact, deterministic festival that exercises the attendee experience without network content.'
    point: '95%,95%'
- eraseText: 150
- inputText: ${DESCRIPTION}
- tapOn: Edit Event Info
- swipe:
    start: 50%, 40%
    end: 50%, 15%
- scrollUntilVisible:
    element: Add Media
    direction: DOWN
- tapOn: Add Media
- tapOn: Image
- tapOn: Choose Photos
- takeScreenshot: choose-event-image
