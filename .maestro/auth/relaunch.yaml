appId: ${APP_ID}
---
# Preserve app data, browser state, and keychain. This is a process restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: {id: menu.account, text: 'Signed in as @${HANDLE}'}
    timeout: 30000
- tapOn: {id: menu.account}
- tapOn: Accounts
- runFlow:
    when: {platform: iOS}
    commands:
      - extendedWaitUntil:
          visible: {id: 'row.account.*', text: '.*Session verified.*'}
          timeout: 30000
- runFlow:
    when: {platform: Android}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'row.account.*'
            containsDescendants:
              - text: '.*Session verified.*'
          timeout: 30000
- takeScreenshot: authenticated-session
- tapOn: Close
