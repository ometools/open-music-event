# Skip configuration for OpenMusicEventTimeZones module.
# Its direct SkipSwiftUI product dependency is declared in Package.swift.
#
# Kotlin dependencies and Gradle build options for this module can be configured here
#build:
#  contents:
#    - block: 'dependencies'
#      contents:
#        - 'implementation("androidx.compose.runtime:runtime")'

# this is a natively-compiled Skip Fuse module
skip:
  mode: 'native'

build:
  contents:
    - block: 'android'
      contents:
        - 'compileSdk = libs.versions.android.sdk.compile.get().toInt()'
        - block: 'defaultConfig'
          contents:
            - 'minSdk = libs.versions.android.sdk.min.get().toInt()'

    - block: 'dependencies'
      contents:
        - 'api(project(":SkipSwiftUI"))'
        - 'api(project(":SkipAndroidBridge"))'
        - 'api(project(":SkipBridge"))'
        - 'api(project(":SkipLib"))'
        - 'api(project(":SkipFoundation"))'
        - 'api(project(":SkipUI"))'
        - 'api(project(":SkipModel"))'
