# Secrets: GITHUB_TOKEN, AWS credentials, OME_RELEASE_BUCKET,
# OME_STAGING_SSH_KEY, OME_STAGING_KNOWN_HOSTS. Keep credentials out of this file.
when:
  - event: ["push"]
    branch: ["main"]

engine: microvm
image: nixos
virtualisation:
  docker: true
dependencies:
  - python3
  - docker-buildx
  - awscli2
  - openssh

environment:
  AWS_REGION: us-west-2
  OME_STAGING_SSH_HOST: stg.openmusicevent.app
  OME_STAGING_SSH_USER: ubuntu
  OME_STAGING_SERVICE: ome-appview-canary.service
  OME_STAGING_DATABASE: /srv/ome-appview/data/canary/open-music-event-appview.sqlite
  OME_STAGING_URL: https://stg.openmusicevent.app

steps:
  - name: Check deployment configuration
    command: python3 Scripts/web-release/pipeline.py preflight
  - name: Check web release tooling
    command: python3 -m unittest discover -s Scripts/web-release -p 'test_*.py' -v
  - name: Test and build immutable web candidate
    command: python3 Scripts/web-release/pipeline.py build
  - name: Publish candidate and deploy staging
    command: python3 Scripts/web-release/pipeline.py stage
