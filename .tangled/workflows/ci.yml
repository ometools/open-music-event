when:
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos
virtualisation:
  docker: true
dependencies:
  - python3
  - docker-buildx

steps:
  - name: Check web release tooling
    command: python3 -m unittest discover -s Scripts/web-release -p 'test_*.py' -v
  - name: Test and package web candidate
    command: bash Scripts/web-release/ci.sh
