# Manually approve the main revision whose exact artifact passed staging.
# Tangled settings: OME_RELEASE_BUCKET and AWS credentials.
# Production settings: OME_PRODUCTION_SSH_HOST, OME_PRODUCTION_SSH_USER,
# OME_PRODUCTION_SERVICE, OME_PRODUCTION_DATABASE, OME_PRODUCTION_URL,
# OME_PRODUCTION_SSH_KEY, OME_PRODUCTION_KNOWN_HOSTS.
when:
  - event: ["manual"]

engine: microvm
image: nixos
dependencies:
  - python3
  - awscli2
  - openssh

environment:
  AWS_REGION: us-west-2

steps:
  - name: Promote the artifact that passed staging
    command: python3 Scripts/web-release/pipeline.py promote
